name: Forward OT message to LINE

on:
  repository_dispatch:
    types: [ot_message]

jobs:
  send-to-line:
    runs-on: ubuntu-latest
    steps:
      - name: Push message to LINE (Messaging API)
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
          MESSAGE: ${{ github.event.client_payload.message }}
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LINE_CHANNEL_TOKEN" \
            -d "$(jq -n --arg to "$LINE_TARGET_ID" --arg text "$MESSAGE" '{to:$to, messages:[{type:"text", text:$text}]}')"
